<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#2563eb" />
  <meta name="format-detection" content="telephone=no" />
  <title>刷题助手</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <header id="topbar">
    <button id="btn-back" class="icon-btn hidden" type="button" aria-label="返回">←</button>
    <h1 id="title">刷题助手</h1>
    <button id="btn-action" class="icon-btn hidden" type="button" aria-label="操作">⋯</button>
  </header>

  <main id="screen" class="screen"></main>

  <nav id="tabbar">
    <button class="tab active" data-screen="banks" type="button"><span>📚</span>题库</button>
    <button class="tab" data-screen="practice" type="button"><span>✍️</span>练习</button>
    <button class="tab" data-screen="wrong" type="button"><span>❌</span>错题</button>
    <button class="tab" data-screen="stats" type="button"><span>📊</span>统计</button>
    <button class="tab" data-screen="settings" type="button"><span>⚙️</span>设置</button>
  </nav>

  <div id="toast" class="toast hidden"></div>
  <div id="sheet" class="sheet-mask hidden"><div class="sheet" id="sheet-body"></div></div>
  <div id="loading" class="loading hidden"><div class="spinner"></div><div id="loading-text">处理中…</div></div>

  <!-- 隐藏的文件选择器：导入题库用 -->
  <input id="file-input" type="file" accept=".docx,.pdf,.txt,.md" class="hidden" />

  <!--
    离线第三方库（由 `npm run vendor` 从 node_modules 拷到 web/vendor/）：
      mammoth     —— 解析 .docx（同时被 extract.js 作为兜底自动注入）
      jspdf       —— 生成 PDF
      html2canvas —— 把导出页面渲染成图片交给 jsPDF（中文才不乱码）
    pdf.js 体积较大，由 extract.js 在导入 PDF 时按需动态 import，这里不预加载。
  -->
  <script defer src="vendor/mammoth.browser.min.js"></script>
  <script defer src="vendor/jspdf.umd.min.js"></script>
  <script defer src="vendor/html2canvas.min.js"></script>

  <script type="module" src="js/app.js"></script>
</body>
</html>
