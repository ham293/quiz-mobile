<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>浏览器自测</title>
  <link rel="stylesheet" href="../web/css/app.css" />
  <style>
    #selftest { position: fixed; inset: 0; z-index: 999; background: #fff; color: #111; overflow: auto;
      font-family: ui-monospace, Consolas, monospace; font-size: 12px; white-space: pre-wrap; padding: 8px; }
    #selftest.hidden { display: none; }
  </style>
</head>
<body>
  <!-- 与 web/index.html 相同的应用外壳（app.js 依赖这些 id） -->
  <header id="topbar">
    <button id="btn-back" class="icon-btn hidden" type="button">←</button>
    <h1 id="title">刷题助手</h1>
    <button id="btn-action" class="icon-btn hidden" type="button">⋯</button>
  </header>
  <main id="screen" class="screen"></main>
  <nav id="tabbar">
    <button class="tab active" data-screen="banks" type="button"><span>📚</span>题库</button>
    <button class="tab" data-screen="practice" type="button"><span>✍️</span>练习</button>
    <button class="tab" data-screen="wrong" type="button"><span>❌</span>错题</button>
    <button class="tab" data-screen="stats" type="button"><span>📊</span>统计</button>
    <button class="tab" data-screen="settings" type="button"><span>⚙️</span>设置</button>
  </nav>
  <div id="toast" class="toast hidden"></div>
  <div id="sheet" class="sheet-mask hidden"><div class="sheet" id="sheet-body"></div></div>
  <div id="loading" class="loading hidden"><div class="spinner"></div><div id="loading-text">处理中…</div></div>
  <input id="file-input" type="file" class="hidden" />

  <script defer src="../web/vendor/mammoth.browser.min.js"></script>
  <script defer src="../web/vendor/jspdf.umd.min.js"></script>
  <script defer src="../web/vendor/html2canvas.min.js"></script>

  <pre id="selftest">自测运行中…</pre>

  <script type="module">
    const log = [];
    const errors = [];
    window.addEventListener('error', (e) => errors.push('window.error: ' + e.message));
    window.addEventListener('unhandledrejection', (e) => errors.push('unhandled: ' + (e.reason && e.reason.message ? e.reason.message : e.reason)));
    const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
    const check = (name, cond, detail = '') => log.push(`${cond ? 'PASS' : 'FAIL'}  ${name}${detail ? '  :: ' + detail : ''}`);
    const out = document.getElementById('selftest');
    const flush = () => { out.textContent = log.join('\n') + '\n---- errors ----\n' + (errors.join('\n') || '（无）') + '\n---- END ----'; };

    try {
      const repo = await import('../web/js/bank.js');
      const db = await import('../web/js/db.js');
      const { extractLines } = await import('../web/js/extract.js');
      const { parseLines } = await import('../web/js/parser-text.js');
      const app = await import('../web/js/app.js');
      const stats = await import('../web/js/stats.js');
      const P = await import('../web/js/practice.js');
      const eb = await import('../web/js/ebbinghaus.js');

      // app.js 的 boot() 在 DOMContentLoaded 里跑；而模块脚本本身会推迟 DOMContentLoaded，
      // 所以这里主动等页面被渲染出内容（最多 3 秒），顺便真实触发一次启动流程。
      document.dispatchEvent(new Event('DOMContentLoaded'));
      for (let i = 0; i < 30 && !document.querySelector('#screen').textContent.trim(); i++) await sleep(100);
      check('应用已启动并且题库页渲染', !!document.querySelector('#screen .empty, #screen .card'),
        document.getElementById('screen').textContent.trim().slice(0, 30));

      /* 1. 真实解析 docx（浏览器路径：mammoth 浏览器构建） */
      const resp = await fetch('../tests/fixtures/sample-questions.docx');
      check('fixture 可下载', resp.ok, String(resp.status));
      const blob = await resp.blob();
      const file = new File([blob], 'sample-questions.docx', {
        type: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document',
      });
      const { lines, kind } = await extractLines(file);
      check('extract.js 识别 docx 并提取行', kind === 'docx' && lines.length === 68, `${kind} / ${lines.length} 行`);

      const parsed = parseLines(lines, '浏览器测试题库');
      check('parser-text 解析出 14 题', parsed.questions.length === 14, `${parsed.questions.length} 题`);
      check('解析日志与跳过行都有内容', parsed.errors.length === 1 && parsed.skipped.length >= 5,
        `errors=${parsed.errors.length} skipped=${parsed.skipped.length}`);

      /* 2. 入库并载入 */
      await repo.importParsed('浏览器测试题库', parsed, { fileName: 'sample-questions.docx', fileType: 'docx' });
      await app.loadBank('浏览器测试题库');
      check('题库载入到全局状态', app.state.bank && app.state.bank.questions.length === 14);

      /* 3. 练习会话：答 3 题（含故意答错） */
      const questions = P.pickQuestions({ bank: app.state.bank, mode: 'order' }).slice(0, 3);
      app.state.questions = questions;
      app.state.index = 0;
      app.state.wrongRecords = [];
      app.state.currentMode = 'order';
      app.state.session = stats.newSession('顺序练习', '浏览器测试题库');
      await app.navigate('session');
      check('练习页渲染出题干', !!document.querySelector('#screen .q-stem'));
      check('练习页渲染出选项', document.querySelectorAll('#screen .option').length >= 2);

      // 第一题：点第一个选项（可能对也可能错），验证反馈出现
      document.querySelector('#screen .option').dispatchEvent(new MouseEvent('click', { bubbles: true }));
      await sleep(120);
      check('作答后出现对错反馈', !!document.querySelector('#screen .feedback'),
        document.querySelector('#screen .feedback') ? document.querySelector('#screen .feedback').textContent.slice(0, 12) : '');
      check('作答后出现「下一题」按钮', /下一题/.test(document.querySelector('#screen .bottom-actions').textContent));

      // 第二题：简答/多选题也要能走通 —— 直接用模块判定，避免依赖题型顺序
      const q1 = questions[0];
      const judged = P.judge(q1, q1.qtype === '判断' ? '正确' : (q1.answer || 'A'));
      check('judge() 能判定正确答案', judged.ok === true, JSON.stringify(judged));

      /* 4. 错题本/收藏本/统计/设置/日志/补录/关于 全部渲染一遍 */
      await repo.recordPracticeResult('浏览器测试题库', questions[0], false);
      await repo.toggleFavorite('浏览器测试题库', questions[1]);
      const routes = [
        ['banks', '题库页'], ['practice', '练习首页'], ['wrong', '错题本'], ['favorites', '收藏本'],
        ['stats', '统计页'], ['settings', '设置页'], ['logs', '解析日志'], ['manual', '手动补录'], ['about', '关于'],
      ];
      for (const [screen, label] of routes) {
        const before = errors.length;
        await app.navigate(screen, {}, { push: false });
        await sleep(60);
        const html = document.getElementById('screen').textContent.trim();
        check(`${label} 渲染有内容且无异常`, html.length > 0 && errors.length === before, `${html.length} 字符`);
      }

      /* 5. 练习报告页 */
      app.state.index = 99;
      await app.navigate('session', {}, { push: false });
      await sleep(80);
      check('练习结束自动跳到报告页', !!(app.state.report));
      if (app.state.report) {
        check('报告含答题数/正确率', typeof app.state.report.answered === 'number' && typeof app.state.report.accuracy === 'number',
          `答 ${app.state.report.answered} 题，正确率 ${app.state.report.accuracy}%`);
      }

      /* 6. 导出 PDF（真实调用 html2canvas + jsPDF） */
      try {
        const exporter = await import('../web/js/exporter.js');
        const okRl = typeof globalThis.jspdf !== 'undefined' && typeof globalThis.html2canvas !== 'undefined';
        check('jspdf / html2canvas 已加载', okRl, `jspdf=${typeof globalThis.jspdf}, html2canvas=${typeof globalThis.html2canvas}`);
        const records = await repo.loadWrong('浏览器测试题库');
        const res = await exporter.exportPdf(records, {
          title: '《浏览器测试题库》错题本', wrongInfo: true, fileName: 'selftest.pdf',
        });
        check('导出 PDF 成功', res && res.blob && res.blob.size > 1000, `${res && res.blob ? res.blob.size : 0} 字节 / ${res && res.pages} 页`);
      } catch (e) {
        check('导出 PDF 成功', false, String(e && e.message));
      }

      /* 7. 真实 PDF 导入 + 各种「假文件 / 坏文件」的报错是否准确 */
      const pdfBlob = await (await fetch('../tests/fixtures/sample-questions.pdf')).blob();
      const realPdf = new File([pdfBlob], '真的.pdf', { type: 'application/pdf' });
      try {
        const r = await extractLines(realPdf);
        check('真实 PDF 能导入且记录页码行号', r.kind === 'pdf' && r.lines.length > 20 && r.lines.every((l) => l.page >= 1 && l.line >= 1),
          `${r.lines.length} 行`);
      } catch (e) {
        check('真实 PDF 能导入且记录页码行号', false, String(e.message).slice(0, 80));
      }

      // 把 docx 改名成 .pdf
      const docxBlob2 = await (await fetch('../tests/fixtures/sample-questions.docx')).blob();
      try {
        await extractLines(new File([docxBlob2], '伪装的.pdf', { type: 'application/pdf' }));
        check('伪装成 .pdf 的文件被识破且提示准确', false, '居然解析成功了');
      } catch (e) {
        check('伪装成 .pdf 的文件被识破且提示准确', /实际内容不是 PDF/.test(e.message), String(e.message).slice(0, 60));
      }

      // 空文件
      try {
        await extractLines(new File([], '空的.pdf', { type: 'application/pdf' }));
        check('空文件提示准确', false, '居然没报错');
      } catch (e) {
        check('空文件提示准确', /空的|0 字节/.test(e.message), String(e.message).slice(0, 40));
      }

      // 有 %PDF- 头但内容损坏：应报真实错误名，而不是笼统甩锅
      try {
        const junk = new File([new TextEncoder().encode('%PDF-1.4\n这不是真的 PDF 内容，随便写点东西。')], '损坏.pdf');
        await extractLines(junk);
        check('损坏 PDF 报出真实错误并自动尝试兼容版', false, '居然解析成功了');
      } catch (e) {
        check('损坏 PDF 报出真实错误并自动尝试兼容版', /真实错误/.test(e.message), String(e.message).replace(/\n/g, ' | ').slice(0, 90));
      }

      /* 8. 示例题库按钮（APK 里的 assets 路径 + 中文题库名） */
      try {
        const summary = await app.importSamples();
        const bank = await repo.getBank('示例题库（PDF 版）');
        check('示例题库能一键导入', !!bank && bank.questions.length === 6, summary);
      } catch (e) {
        check('示例题库能一键导入', false, String(e.message).slice(0, 80));
      }

      /* 9. 验证「不创建 Worker 的主线程模式」真的有效（安卓 WebView 的兜底手段） */
      try {
        const OrigWorker = window.Worker;
        let workerUsed = 0;
        window.Worker = class {
          constructor() {
            workerUsed += 1;
            throw new Error('模拟：WebView 里 Worker 不可用');
          }
        };
        try {
          // 预先在主线程挂上 worker 模块（等价于 extract.js 的 enableMainThreadMode 效果）
          const wmod = await import('../web/vendor/pdf.worker.min.mjs');
          globalThis.pdfjsWorker = { WorkerMessageHandler: wmod.WorkerMessageHandler };
          const r2 = await extractLines(new File([pdfBlob], '主线程模式.pdf', { type: 'application/pdf' }));
          check(
            '挂上 pdfjsWorker 后完全不创建 Worker 也能解析',
            workerUsed === 0 && r2.lines.length > 20,
            `Worker 调用次数=${workerUsed}，解析 ${r2.lines.length} 行`,
          );
        } finally {
          window.Worker = OrigWorker;
        }
      } catch (e) {
        check('挂上 pdfjsWorker 后完全不创建 Worker 也能解析', false, String(e.message).slice(0, 90));
      }

      /* 10. 知识点自动出题页面 + 纯逻辑生成 */
      try {
        const gen = await import('../web/js/generator.js');
        const knowledge = [
          '第一章 中国近代史',
          '1840年，英国发动了鸦片战争，中国开始沦为半殖民地半封建社会。',
          '1851年，洪秀全领导了太平天国运动，沉重打击了清王朝的统治。',
          '1894年，日本发动甲午中日战争，清政府战败并签订了《马关条约》。',
          '1911年，辛亥革命推翻了清王朝的统治，结束了中国两千多年的封建君主专制制度。',
          '1919年，五四运动标志着新民主主义革命的开端。',
          '1921年，中国共产党第一次全国代表大会在上海召开，标志着中国共产党的成立。',
          '1937年，日本发动卢沟桥事变，中国全民族抗战由此开始。',
          '1949年，中华人民共和国成立，标志着新民主主义革命取得了伟大胜利。',
          '1956年，三大改造基本完成，社会主义制度在中国基本建立起来。',
        ];
        const out = gen.generateQuestions(knowledge, { types: ['fill', 'choice', 'judge'], count: 20 });
        check('知识点能自动生成题目', out.questions.length >= 6, `生成 ${out.questions.length} 题 / ${out.sentences} 句`);
        const hasAnswer = out.questions.every((q) => q.answer && q.stem && q.options);
        check('每道生成题都带参考答案与选项', hasAnswer, JSON.stringify(out.questions[0] || {}).slice(0, 80));
        const kinds = {};
        out.questions.forEach((q) => { kinds[q.qtype] = (kinds[q.qtype] || 0) + 1; });
        check('生成的题型分布合理', Object.keys(kinds).length >= 1, JSON.stringify(kinds));

        const app2 = app;
        await app2.navigate('generate', {}, { push: false });
        await sleep(300);
        const text = document.getElementById('screen').textContent.trim();
        check('知识点出题页面能渲染', text.length > 20, text.slice(0, 40));
      } catch (e) {
        check('知识点能自动生成题目', false, String(e.message).slice(0, 100));
      }

      /* 11. polyfill：模拟旧 WebView 缺 Promise.withResolvers */
      try {
        const original = Promise.withResolvers;
        try {
          delete Promise.withResolvers;
          const missing = typeof Promise.withResolvers !== 'function';
          // 用带查询串的 URL 强制重新求值 polyfills 模块
          await import('../web/js/polyfills.js?selftest=1');
          const fixed = typeof Promise.withResolvers === 'function';
          const r3 = await extractLines(new File([pdfBlob], '缺API.pdf', { type: 'application/pdf' }));
          check(
            '缺 Promise.withResolvers 时自动补齐且仍能解析 PDF',
            missing && fixed && r3.lines.length > 20,
            `补齐=${fixed}，解析 ${r3.lines.length} 行`,
          );
        } finally {
          if (original) Promise.withResolvers = original;
        }
      } catch (e) {
        check('缺 Promise.withResolvers 时自动补齐且仍能解析 PDF', false, String(e.message).slice(0, 90));
      }

      /* 12. 机器自检页 */
      try {
        await app.navigate('selftest', {}, { push: false });
        let shown = '';
        for (let i = 0; i < 60; i += 1) {
          await sleep(500);
          shown = document.getElementById('screen').textContent || '';
          if (shown.includes('UA:')) break;
        }
        check('机器自检页能跑完并出报告', shown.includes('✅') && shown.includes('App v'), shown.replace(/\s+/g, ' ').slice(0, 60));
      } catch (e) {
        check('机器自检页能跑完并出报告', false, String(e.message).slice(0, 90));
      }

      /* 13. 数据落盘检查 */
      const banks = await repo.listBanks();
      check('IndexedDB 中已保存题库', banks.length >= 1, banks.map((b) => `${b.name}(${b.questionCount})`).join(','));
      check('错题本有记录', (await repo.wrongTotal('浏览器测试题库')) >= 1);
      check('收藏本有记录', (await repo.favoriteTotal('浏览器测试题库')) >= 1);
      check('艾宾浩斯：错题当天到期', eb.dueCount(await repo.loadWrong('浏览器测试题库')) >= 1);
    } catch (err) {
      log.push('FAIL  自测脚本异常 :: ' + (err && err.stack ? err.stack : err));
    }

    flush();
    window.__selftestDone = true;
    document.title = log.some((l) => l.startsWith('FAIL')) || errors.length ? 'SELFTEST-HAS-FAILURES' : 'SELFTEST-OK';

    // 把结果回传给本地自测服务器（tests/result_server.py）
    try {
      const payload = JSON.stringify({
        title: document.title,
        passed: log.filter((l) => l.startsWith('PASS')).length,
        failed: log.filter((l) => l.startsWith('FAIL')).length,
        errors,
        log,
      }, null, 2);
      await fetch('/__result', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: payload });
    } catch (e) {
      // 服务器不存在时忽略
    }
  </script>
</body>
</html>
